version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    # TypeScript 7 waits until SvelteKit supports it (TODO.md).
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
