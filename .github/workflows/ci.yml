name: ci

on:
  pull_request:
    branches-ignore: ['release-please--**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.13
  TZ: UTC

jobs:
  # EXPERIMENT ONLY (tmp/e2e-mutation-day). Runs the one spec against a deliberately broken
  # render of the reference day. A failure here is the result being looked for.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - run: bunx playwright test e2e/mentioned-in.spec.ts
