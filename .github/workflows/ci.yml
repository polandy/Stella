name: ci

on:
  pull_request:
    branches-ignore: ['release-please--**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.13

jobs:
  # EXPERIMENT ONLY (tmp/e2e-sw-ab). Eight runs of shard 1 of the same commit in one go,
  # half with the service worker blocked and half with it left alone, so the only thing
  # that differs between the two halves is the setting under test.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sw: [block, allow]
        rep: [1, 2, 3, 4]
    name: sw=${{ matrix.sw }} rep=${{ matrix.rep }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - run: bunx playwright test --shard=1/3
        env:
          E2E_SERVICE_WORKERS: ${{ matrix.sw }}
