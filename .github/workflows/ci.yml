name: ci

on:
  push:
    branches: [main]
  pull_request:

# A push that supersedes an earlier one on the same branch cancels its run; on main every
# commit is kept, because release-please and the deploy read those results.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.3.13
  # Workflow-wide, so the e2e server and the browser driving it cannot end up in different
  # days: the suite compares dates it builds itself against dates the server works out from
  # its own clock. The runner happens to be UTC already; saying so keeps a changed runner
  # image from silently moving every date by a day.
  TZ: UTC

jobs:
  verify:
    runs-on: ubuntu-latest
    # A hung dev-smoke or check must not sit on the runner for GitHub's six-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun run test
      # The dev server runs in a third runtime — Vite's module runner under Bun — that
      # neither the unit tests nor the e2e build exercise, so it needs its own check.
      - run: ./scripts/dev-smoke.sh

  e2e:
    runs-on: ubuntu-latest
    # The slowest shard runs about three minutes; a shard still going at fifteen is stuck
    # (a server that never came up, a browser that never answered), not slow.
    timeout-minutes: 15
    strategy:
      # The suite is serial within a shard (one server, one database), so the only way to
      # spend less wall-clock time on it is to give each slice its own server. Each shard pays
      # about forty seconds of fixed cost (runner, install, the 25 s `vite build`) before its
      # first test, and the run ends when the slowest shard does. Playwright splits by test
      # count, not by duration, so the slow specs (`immich-together`, `pwa-offline`) land where
      # they land; more shards shrink that imbalance too. Measured on 709 s of total test time:
      # five shards leave the slowest at ~3:50, eight at ~2:30. Beyond that the overhead grows
      # faster than the slowest shard shrinks. The repository is public, so the extra runner
      # minutes are free.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The runner can drive Chromium directly, so CI skips e2e/run.sh's container.
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          # The lockfile pins @playwright/test, and its version decides the browser build.
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # No `--with-deps`: the runner image ships Chrome, so Chromium's system libraries are
      # already there, and the apt run that installed them again cost 15–30 s on every shard.
      # A cache hit makes this a no-op.
      - run: bunx playwright install chromium
      - run: bunx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
