name: ci

on:
  push:
    branches: [main]
  pull_request:
    # release-please's PR only bumps the version, the changelog and the manifest — content
    # that already passed CI on main. Its branch is authored by github-actions[bot], whose
    # association is CONTRIBUTOR, so every run on it needs a manual "Approve and run" and
    # otherwise sits in `action_required` until the merge deletes the branch — at which
    # point GitHub flips the abandoned run to a failure blaming the workflow file.
    branches-ignore: ['release-please--**']

# A push that supersedes an earlier one on the same branch cancels its run; on main every
# commit is kept, because release-please and the deploy read those results.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.3.13

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test

  e2e:
    runs-on: ubuntu-latest
    strategy:
      # The suite is serial within a shard (one server, one database), so the only way to
      # spend less wall-clock time on it is to give each slice its own server.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The runner can drive Chromium directly, so CI skips e2e/run.sh's container.
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          # The lockfile pins @playwright/test, and its version decides the browser build.
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - if: steps.browsers.outputs.cache-hit == 'true'
        # The browser came from the cache; only its system libraries are still missing.
        run: bunx playwright install-deps chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - run: bunx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
