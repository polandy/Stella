name: publish

# Called by the release job once release-please has cut a release, and runnable by hand to
# re-publish a tag whose build failed.
#
# It is deliberately NOT triggered by the release tag itself: release-please pushes that tag
# with the run's GITHUB_TOKEN, and GitHub does not start workflows from events a token
# creates. A `push: tags` trigger here would therefore never fire on a real release.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.0.3
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.0.3
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.tag }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/stella

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The tag, not the caller's ref: a re-run must build the commit that was released.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `value:` supplies the version, because the workflow runs off the caller's ref
          # rather than the tag and the semver patterns would otherwise match nothing.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A tag can be moved; a digest cannot. Self-hosted deployments pin the digest, so
      # print it where it can be copied rather than making anyone go and look it up.
      - name: Report the digest to pin
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
