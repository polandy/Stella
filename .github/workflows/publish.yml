name: publish

# Releases are cut by release-please, which pushes a `vX.Y.Z` tag; that tag is what a
# deployment pins. Manual runs exist for re-publishing a tag whose build failed.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/stella

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `latest` follows the newest release; the version tags are what deployments pin.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A tag can be moved; a digest cannot. Self-hosted deployments pin the digest, so
      # print it where it can be copied rather than making anyone go and look it up.
      - name: Report the digest to pin
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ env.IMAGE }}:${{ github.ref_name }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
