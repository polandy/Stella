name: publish

# Called by the release job once release-please has cut a release, by the weekly rebuild
# (rebuild.yml) to refresh the latest release's packages, and runnable by hand to re-publish a
# tag whose build failed.
#
# It is deliberately NOT triggered by the release tag itself: when release-please pushes that
# tag with the run's GITHUB_TOKEN, GitHub starts no workflow from it, and with a personal
# token a tag trigger would build every release twice.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.0.3
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.0.3
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.tag }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/stella

jobs:
  image:
    runs-on: ubuntu-latest
    # A cold build (no layer cache) finishes in a few minutes; a registry push that hangs
    # must not hold the runner longer than that.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # The tag, not the caller's ref: a re-run must build the commit that was released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An old tag re-published by hand must not move `latest` backwards.
      - id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest="$(gh release view --repo '${{ github.repository }}' --json tagName --jq .tagName)"
          echo "latest=$([ "$newest" = '${{ inputs.tag }}' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # `value:` supplies the version, because the workflow runs off the caller's ref
          # rather than the tag and the semver patterns would otherwise match nothing.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ steps.newest.outputs.latest }}

      # Built without a layer cache, so `apt-get upgrade` and the base image are current —
      # the weekly rebuild exists for exactly that — and loaded locally to be scanned first.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          no-cache: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Nothing is pushed while it carries a CRITICAL vulnerability that has a fix.
      - run: ./scripts/scan-image.sh "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"

      # Rebuilt from the build cache the scanned build just filled, so the layers are the ones
      # that were scanned; only now is there an image index to hang provenance and an SBOM on.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Keyless: the signature is bound to this workflow's identity, so `cosign verify` can
      # tell a digest this repository built from one somebody else pushed.
      - name: Sign the image
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"

      # A tag can be moved; a digest cannot. Self-hosted deployments pin the digest, so
      # print it where it can be copied rather than making anyone go and look it up.
      - name: Report the digest to pin
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}@${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
