# Simple, self-contained setup: builds the image and binds the port to localhost.
# For the reverse-proxy + Authelia SSO deployment, see docs/07-deployment.md §7.5.
services:
  stella:
    build: .
    image: stella:latest
    container_name: stella
    restart: unless-stopped
    env_file: .env
    environment:
      # adapter-node checks the browser Origin header against this on every POST.
      # Must equal the URL you open in the browser or all form submissions 403.
      - ORIGIN=${STELLA_URL:-http://localhost:3000}
    volumes:
      - ./data:/data
    # Bound on all interfaces so the container is reachable on the LAN (host firewall
    # opens TCP 3000). STELLA_URL/ORIGIN in .env must match the address browsed to.
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
