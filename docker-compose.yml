# Simple, self-contained setup: builds the image and binds the port to localhost by default.
# For the reverse-proxy + Authelia SSO deployment, see docs/dev/07-deployment.md §7.5.
services:
  stella:
    build: .
    image: stella:latest
    container_name: stella
    restart: unless-stopped
    env_file: .env
    environment:
      # adapter-node checks the browser Origin header against this on every POST.
      # Must equal the URL you open in the browser or all form submissions 403.
      - ORIGIN=${STELLA_URL:-http://localhost:3000}
    volumes:
      # Named volume (not a host folder) so state is easy to wipe:
      #   docker compose down -v   →   removes the DB + media for a clean slate.
      - stella-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    # Loopback only by default; STELLA_BIND=0.0.0.0 in .env opens it to the LAN (docs/user/install.md).
    # STELLA_URL/ORIGIN in .env must match the address browsed to.
    ports:
      - '${STELLA_BIND:-127.0.0.1}:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  stella-data:
