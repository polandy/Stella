<title>Device Unlock Hint</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<style>
	/* Layout: a control strip over one phone-width Home; the hint card is the only thing that changes. Colours are Stella's Latte/Mocha tokens. */
	:root {
		--bg: #e6e9ef;
		--card: #ffffff;
		--sunken: #eff1f5;
		--border: #e7e9f0;
		--fg: #4c4f69;
		--muted: #6c6f85;
		--primary: #853ae8;
		--primary-fill: #8839ef;
		--primary-fg: #ffffff;
		--primary-soft: #efe5fd;
		--success: #476f50;
		--success-soft: #e3f1df;
		--danger: #cb123b;
		--focus: #1e66f5;
		--shadow: 0 1px 2px rgb(76 79 105 / 0.06), 0 6px 20px -8px rgb(76 79 105 / 0.2);
		--scrim: rgb(17 17 27 / 0.45);
		--font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
	}
	@media (prefers-color-scheme: dark) {
		:root:not([data-theme='light']) {
			--bg: #1e1e2e;
			--card: #232334;
			--sunken: #181825;
			--border: #313244;
			--fg: #cdd6f4;
			--muted: #a6adc8;
			--primary: #cba6f7;
			--primary-fill: #cba6f7;
			--primary-fg: #1e1e2e;
			--primary-soft: #3a3150;
			--success: #a6e3a1;
			--success-soft: #2b3a33;
			--danger: #f38ba8;
			--focus: #89b4fa;
			--shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 6px 20px -8px rgb(0 0 0 / 0.5);
			--scrim: rgb(0 0 0 / 0.55);
			color-scheme: dark;
		}
	}
	:root[data-theme='dark'] {
		--bg: #1e1e2e;
		--card: #232334;
		--sunken: #181825;
		--border: #313244;
		--fg: #cdd6f4;
		--muted: #a6adc8;
		--primary: #cba6f7;
		--primary-fill: #cba6f7;
		--primary-fg: #1e1e2e;
		--primary-soft: #3a3150;
		--success: #a6e3a1;
		--success-soft: #2b3a33;
		--danger: #f38ba8;
		--focus: #89b4fa;
		--shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 6px 20px -8px rgb(0 0 0 / 0.5);
		--scrim: rgb(0 0 0 / 0.55);
		color-scheme: dark;
	}
	body {
		background: var(--bg);
		color: var(--fg);
		font-family: var(--font);
		font-size: 15px;
		line-height: 1.45;
	}
	.wrap {
		max-width: 980px;
		margin: 0 auto;
		padding-block: 20px 48px;
		padding-left: max(16px, env(safe-area-inset-left, 0px));
		padding-right: max(16px, env(safe-area-inset-right, 0px));
		display: grid;
		grid-template-columns: minmax(0, 1fr) 412px;
		gap: 28px;
		align-items: start;
	}
	@media (max-width: 860px) {
		.wrap {
			grid-template-columns: minmax(0, 1fr);
		}
	}
	h1 {
		font-size: 20px;
		margin: 0 0 4px;
		text-wrap: balance;
	}
	.lede {
		color: var(--muted);
		margin: 0 0 16px;
		max-width: 60ch;
	}
	.ctl {
		display: grid;
		gap: 14px;
	}
	.ctl fieldset {
		border: 0;
		margin: 0;
		padding: 0;
		display: grid;
		gap: 6px;
	}
	.ctl legend {
		font-size: 12px;
		text-transform: uppercase;
		letter-spacing: 0.06em;
		color: var(--muted);
		margin-bottom: 6px;
	}
	.pills {
		display: flex;
		flex-wrap: wrap;
		gap: 6px;
	}
	.pill {
		font: inherit;
		font-size: 13px;
		border: 1px solid var(--border);
		background: var(--card);
		color: var(--fg);
		border-radius: 999px;
		padding: 5px 12px;
		cursor: pointer;
	}
	.pill[aria-pressed='true'] {
		background: var(--primary-soft);
		border-color: var(--primary);
		color: var(--primary);
		font-weight: 600;
	}
	.note {
		background: var(--card);
		border: 1px solid var(--border);
		border-radius: 10px;
		padding: 12px 14px;
		font-size: 14px;
		min-width: 0;
	}
	.note b {
		display: block;
		margin-bottom: 2px;
	}
	.note code {
		font-size: 12px;
		word-break: break-all;
	}
	:focus-visible {
		outline: 2px solid var(--focus);
		outline-offset: 2px;
	}

	/* The phone */
	.phone {
		position: relative;
		width: 100%;
		max-width: 412px;
		height: 780px;
		border-radius: 28px;
		border: 8px solid var(--fg);
		background: var(--bg);
		overflow: hidden;
		box-shadow: var(--shadow);
		justify-self: center;
	}
	.screen {
		height: 100%;
		overflow-y: auto;
		display: flex;
		flex-direction: column;
	}
	.bar {
		position: sticky;
		top: 0;
		z-index: 2;
		display: flex;
		align-items: center;
		gap: 10px;
		padding: 12px 14px;
		background: var(--card);
		border-bottom: 1px solid var(--border);
	}
	.brand {
		font-weight: 700;
		color: var(--primary);
		font-size: 17px;
	}
	.lock {
		margin-left: auto;
		display: inline-flex;
		align-items: center;
		gap: 5px;
		font-size: 13px;
		color: var(--muted);
		border: 1px solid var(--border);
		border-radius: 999px;
		padding: 3px 10px;
	}
	.lock svg,
	.ico svg {
		width: 16px;
		height: 16px;
	}
	.content {
		padding: 14px;
		display: grid;
		gap: 12px;
	}
	.capture {
		background: var(--card);
		border: 1px solid var(--border);
		border-radius: 12px;
		padding: 12px 14px;
		color: var(--muted);
	}
	.item {
		background: var(--card);
		border-radius: 12px;
		padding: 12px 14px;
		box-shadow: var(--shadow);
		display: grid;
		gap: 6px;
	}
	.meta {
		font-size: 12px;
		color: var(--muted);
		display: flex;
		gap: 8px;
		align-items: center;
	}
	.priv {
		display: inline-flex;
		align-items: center;
		gap: 3px;
	}
	.priv svg {
		width: 12px;
		height: 12px;
	}
	.veil {
		filter: blur(6px);
		user-select: none;
	}

	/* The hint card */
	.hint {
		background: var(--card);
		border-radius: 12px;
		box-shadow: var(--shadow);
		padding: 14px;
		display: grid;
		grid-template-columns: 36px minmax(0, 1fr);
		gap: 4px 12px;
	}
	.hint .ico {
		width: 36px;
		height: 36px;
		border-radius: 50%;
		background: var(--primary-soft);
		color: var(--primary);
		display: grid;
		place-items: center;
		grid-row: span 3;
	}
	.hint .ico.ok {
		background: var(--success-soft);
		color: var(--success);
	}
	.hint .label {
		font-size: 12px;
		color: var(--muted);
	}
	.hint h2 {
		font-size: 16px;
		margin: 0;
		line-height: 1.3;
		text-wrap: balance;
	}
	.hint p {
		margin: 0;
		font-size: 14px;
		color: var(--muted);
	}
	.hint .err {
		grid-column: 1 / -1;
		color: var(--danger);
		font-size: 14px;
		margin-top: 6px;
	}
	.hint .done {
		color: var(--success);
		font-size: 14px;
		align-self: center;
	}
	.actions {
		grid-column: 1 / -1;
		display: grid;
		grid-template-columns: 1fr 1fr;
		gap: 8px;
		margin-top: 10px;
	}
	.actions .primary {
		grid-column: 1 / -1;
	}
	.actions.one {
		grid-template-columns: auto;
		justify-content: end;
	}
	.btn {
		font: inherit;
		font-size: 14px;
		font-weight: 600;
		border-radius: 10px;
		padding: 9px 14px;
		cursor: pointer;
		border: 1px solid transparent;
	}
	.btn:disabled {
		opacity: 0.55;
		cursor: default;
	}
	.primary {
		background: var(--primary-fill);
		color: var(--primary-fg);
	}
	.ghost {
		background: transparent;
		color: var(--fg);
		border-color: var(--border);
	}
	.spin {
		display: inline-block;
		width: 12px;
		height: 12px;
		border: 2px solid currentColor;
		border-right-color: transparent;
		border-radius: 50%;
		vertical-align: -1px;
		margin-right: 6px;
		animation: spin 0.8s linear infinite;
	}
	@keyframes spin {
		to {
			transform: rotate(360deg);
		}
	}
	@media (prefers-reduced-motion: reduce) {
		.spin {
			animation: none;
		}
	}

	/* Toast and the stand-in for the device's own prompt */
	.toast {
		position: absolute;
		left: 14px;
		right: 14px;
		bottom: 18px;
		z-index: 5;
		background: var(--fg);
		color: var(--bg);
		border-radius: 10px;
		padding: 10px 14px;
		font-size: 14px;
		display: flex;
		gap: 12px;
		align-items: center;
	}
	.toast span {
		flex: 1;
		min-width: 0;
	}
	.toast button {
		font: inherit;
		font-weight: 700;
		background: none;
		border: 0;
		color: var(--bg);
		text-decoration: underline;
		cursor: pointer;
	}
	.os {
		position: absolute;
		inset: 0;
		z-index: 6;
		background: var(--scrim);
		display: flex;
		align-items: flex-end;
	}
	.os-sheet {
		width: 100%;
		background: var(--sunken);
		color: var(--fg);
		border-radius: 18px 18px 0 0;
		padding: 20px 18px 26px;
		display: grid;
		gap: 10px;
		justify-items: center;
		text-align: center;
	}
	.os-sheet .tag {
		font-size: 11px;
		color: var(--muted);
		text-transform: uppercase;
		letter-spacing: 0.06em;
	}
	.os-sheet svg {
		width: 44px;
		height: 44px;
		color: var(--primary);
	}
	.os-row {
		display: flex;
		gap: 8px;
		width: 100%;
	}
	.os-row .btn {
		flex: 1;
	}
	.empty-hint {
		font-size: 13px;
		color: var(--muted);
		text-align: center;
		padding: 4px 8px;
	}
</style>

<div class="wrap">
	<section>
		<h1>Device-unlock hint after sign-in</h1>
		<p class="lede">
			The card on Home that offers device unlock to a member signed in on a new device. Click
			the buttons in the phone, or jump to a state below. Concept:
			<code>docs/dev/concepts/device-unlock-hint.md</code>.
		</p>
		<div class="ctl">
			<fieldset>
				<legend>State</legend>
				<div class="pills" id="states"></div>
			</fieldset>
			<fieldset>
				<legend>Language</legend>
				<div class="pills" id="langs"></div>
			</fieldset>
			<fieldset>
				<legend>Theme</legend>
				<div class="pills" id="themes"></div>
			</fieldset>
			<div class="note" id="explain"></div>
		</div>
	</section>
	<div class="phone" aria-label="Stella on a phone">
		<div class="screen">
			<div class="bar">
				<span class="brand">Stella</span>
				<span class="lock" id="lock"></span>
			</div>
			<div class="content" id="content"></div>
		</div>
		<div id="overlay"></div>
	</div>
</div>

<script>
	const LOCK =
		'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
	const CHECK =
		'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
	const PRINT =
		'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 11v4"/><path d="M8.5 13a3.5 3.5 0 0 1 7 0v2a8 8 0 0 1-1 4"/><path d="M5.5 13a6.5 6.5 0 0 1 13 0v1"/><path d="M9 19.5a10 10 0 0 0 .5-3"/><path d="M3.5 9a9.5 9.5 0 0 1 17 0"/></svg>';

	const T = {
		en: {
			label: 'Privacy',
			title: 'Show private entries with your fingerprint, face or PIN',
			body: 'Your private entries are blurred against a glance over your shoulder. Set up device unlock, and one check shows them all for five minutes. It uses a passkey in your password manager.',
			setUp: 'Set up device unlock',
			waiting: 'Waiting for your device…',
			later: 'Later',
			never: 'Not on this device',
			done: 'Device unlock is set up on this device. Tap a blurred entry or the lock in the top bar to use it.',
			doneButton: 'Done',
			failed: 'Device unlock wasn’t set up. Try again, or later in Settings · Privacy.',
			snoozed: 'We’ll ask again in a week. Settings · Privacy has it any time.',
			dismissed: 'We won’t ask on this device. Settings · Privacy still has it.',
			undo: 'Undo',
			lock: '3 private',
			capture: 'What happened today?',
			note: 'Note',
			moment: 'Moment',
			priv: 'Private',
			allRead: 'Home without the card: the browser can’t use a passkey.',
			osTag: 'Device prompt (not Stella’s)',
			osTitle: 'Create a passkey for Stella?',
			osBody: 'Use your fingerprint to save a passkey for “andy” on this device.',
			osOk: 'Touch the sensor',
			osCancel: 'Cancel'
		},
		de: {
			label: 'Privatsphäre',
			title: 'Private Einträge mit Fingerabdruck, Gesicht oder PIN zeigen',
			body: 'Deine privaten Einträge sind verschwommen, gegen den Blick über die Schulter. Richte die Geräte-Entsperrung ein, dann zeigt eine Bestätigung alle für fünf Minuten. Dafür nutzt Stella einen Passkey in deinem Passwortmanager.',
			setUp: 'Geräte-Entsperrung einrichten',
			waiting: 'Warte auf dein Gerät …',
			later: 'Später',
			never: 'Nicht auf diesem Gerät',
			done: 'Die Geräte-Entsperrung ist auf diesem Gerät eingerichtet. Tippe auf einen verschwommenen Eintrag oder das Schloss oben, um sie zu nutzen.',
			doneButton: 'Fertig',
			failed:
				'Die Geräte-Entsperrung wurde nicht eingerichtet. Versuch es noch einmal oder später unter Einstellungen · Privatsphäre.',
			snoozed: 'Wir fragen in einer Woche wieder. Unter Einstellungen · Privatsphäre geht es jederzeit.',
			dismissed:
				'Auf diesem Gerät fragen wir nicht mehr. Unter Einstellungen · Privatsphäre geht es weiterhin.',
			undo: 'Rückgängig',
			lock: '3 privat',
			capture: 'Was ist heute passiert?',
			note: 'Notiz',
			moment: 'Moment',
			priv: 'Privat',
			allRead: 'Home ohne Karte: Der Browser kann keinen Passkey nutzen.',
			osTag: 'Geräte-Dialog (nicht von Stella)',
			osTitle: 'Passkey für Stella erstellen?',
			osBody: 'Mit deinem Fingerabdruck einen Passkey für „andy“ auf diesem Gerät speichern.',
			osOk: 'Sensor berühren',
			osCancel: 'Abbrechen'
		}
	};

	const STATES = {
		offer: ['Offer', 'First visit to Home on this device: blur is on, the browser can do passkeys, nothing set up or answered yet.'],
		prompt: ['Device prompt', 'After *Set up device unlock*: the device’s own passkey sheet is open; the card waits with its buttons disabled.'],
		waiting: ['Waiting', 'The card while the device prompt is open (shown here without the sheet).'],
		done: ['Set up', 'The passkey was created. One success line; *Done* or leaving Home removes the card for good.'],
		failed: ['Cancelled', 'The member cancelled the device prompt or it failed. The card stays with one line in danger; nothing is stored.'],
		later: ['Later', 'The card is gone; it comes back in 7 days on this device (stored: snoozedUntil).'],
		never: ['Not on this device', 'The card is gone for good on this device (stored: never); Undo brings it back within the usual window.'],
		unsupported: ['No passkey', 'No WebAuthn, no platform authenticator or plain http: no card at all. Settings · Privacy already says why.']
	};

	let state = 'offer';
	let lang = 'en';
	let theme = 'system';

	const $ = (id) => document.getElementById(id);
	const md = (s) => s.replace(/\*(.+?)\*/g, '<em>$1</em>');

	function pills(el, items, current, pick) {
		el.innerHTML = '';
		for (const [key, label] of items) {
			const b = document.createElement('button');
			b.className = 'pill';
			b.type = 'button';
			b.textContent = label;
			b.setAttribute('aria-pressed', String(key === current));
			b.addEventListener('click', () => pick(key));
			el.append(b);
		}
	}

	function hintCard(t) {
		if (state === 'done') {
			return `<div class="hint"><span class="ico ok">${CHECK}</span>
				<span class="label">${t.label}</span>
				<p class="done">${t.done}</p>
				<div class="actions one"><button class="btn ghost" data-act="close">${t.doneButton}</button></div></div>`;
		}
		const busy = state === 'waiting' || state === 'prompt';
		return `<div class="hint" role="region" aria-label="${t.label}"><span class="ico">${LOCK}</span>
			<span class="label">${t.label}</span>
			<h2>${t.title}</h2>
			<p>${t.body}</p>
			${state === 'failed' ? `<p class="err" role="status">${t.failed}</p>` : ''}
			<div class="actions">
				<button class="btn primary" data-act="setup" ${busy ? 'disabled' : ''}>${busy ? `<span class="spin"></span>${t.waiting}` : t.setUp}</button>
				<button class="btn ghost" data-act="later" ${busy ? 'disabled' : ''}>${t.later}</button>
				<button class="btn ghost" data-act="never" ${busy ? 'disabled' : ''}>${t.never}</button>
			</div></div>`;
	}

	function stream(t) {
		const priv = `<span class="priv">${LOCK}${t.priv}</span>`;
		return `<div class="item"><div class="meta">${t.note} · Rosa · ${priv}</div>
				<div class="veil" aria-hidden="true">Talked about the move, she is worried about the new school</div></div>
			<div class="item"><div class="meta">${t.moment} · Mia</div>
				<div>${lang === 'de' ? 'Erste Fahrradtour ohne Stützräder' : 'First bike ride without stabilisers'}</div></div>
			<div class="item"><div class="meta">${t.note} · Hilde · ${priv}</div>
				<div class="veil" aria-hidden="true">Gift idea she must not hear about yet</div></div>`;
	}

	function render() {
		const t = T[lang];
		document.documentElement.lang = lang;
		if (theme === 'system') document.documentElement.removeAttribute('data-theme');
		else document.documentElement.dataset.theme = theme;

		pills($('states'), Object.entries(STATES).map(([k, v]) => [k, v[0]]), state, (k) => ((state = k), render()));
		pills($('langs'), [['en', 'English'], ['de', 'Deutsch']], lang, (k) => ((lang = k), render()));
		pills($('themes'), [['system', 'System'], ['light', 'Latte'], ['dark', 'Mocha']], theme, (k) => ((theme = k), render()));
		const info = STATES[state] ?? ['Gone', 'After *Done*: Home as usual; the card never comes back on this device.'];
		$('explain').innerHTML = `<b>${info[0]}</b>${md(info[1])}`;

		$('lock').innerHTML = `${LOCK}${t.lock}`;
		const showCard = ['offer', 'prompt', 'waiting', 'done', 'failed'].includes(state);
		$('content').innerHTML =
			(showCard ? hintCard(t) : '') +
			`<div class="capture">${t.capture}</div>` +
			(state === 'unsupported' ? `<p class="empty-hint">${t.allRead}</p>` : '') +
			stream(t);

		let overlay = '';
		if (state === 'prompt') {
			overlay = `<div class="os"><div class="os-sheet" role="dialog" aria-label="${t.osTitle}">
				<span class="tag">${t.osTag}</span>${PRINT}<strong>${t.osTitle}</strong><span>${t.osBody}</span>
				<div class="os-row"><button class="btn ghost" data-act="os-cancel">${t.osCancel}</button>
				<button class="btn primary" data-act="os-ok">${t.osOk}</button></div></div></div>`;
		} else if (state === 'later') {
			overlay = `<div class="toast" role="status"><span>${t.snoozed}</span></div>`;
		} else if (state === 'never') {
			overlay = `<div class="toast" role="status"><span>${t.dismissed}</span><button data-act="undo">${t.undo}</button></div>`;
		}
		$('overlay').innerHTML = overlay;
	}

	document.addEventListener('click', (e) => {
		const act = e.target.closest('[data-act]')?.dataset.act;
		const next = { setup: 'prompt', later: 'later', never: 'never', 'os-ok': 'done', 'os-cancel': 'failed', undo: 'offer', close: 'gone' }[act];
		if (!next) return;
		state = next;
		render();
	});

	render();
</script>
