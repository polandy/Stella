<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact review mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Stella's semantic tokens as src/app.css maps them: Latte on bare :root, Mocha for dark. */
  :root {
    --page:#dce0e8; --bg:#e6e9ef; --bg-sunken:#dce0e8; --card:#ffffff; --card-hover:#f7f8fb;
    --border:#ccd0da; --border-subtle:#e7e9f0; --border-input:#7c7f93;
    --fg:#4c4f69; --fg-muted:#5c5f77; --fg-subtle:#6c6f85;
    --primary:#853ae8; --primary-fg:#ffffff; --link:#2761d9; --danger:#cb123b;
    --success-text:#476f50; --success:#40a02b; --warn:#df8e1d; --warn-text:#8a5a0f;
    --av-a:#f4dcdc; --av-b:#d3e2fb; --av-c:#cdeceb; --av-d:#fbe2cf; --av-e:#e7dbfb; --av-f:#d9eed2;
    --shadow-card:0 1px 2px rgb(76 79 105 / .06), 0 6px 20px -8px rgb(76 79 105 / .2);
    --focus-ring:#1e66f5;
    --sans:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme:dark;
      --page:#11111b; --bg:#181825; --bg-sunken:#11111b; --card:#232334; --card-hover:#2a2a3d;
      --border:#313244; --border-subtle:#292939; --border-input:#7f849c;
      --fg:#cdd6f4; --fg-muted:#bac2de; --fg-subtle:#a6adc8;
      --primary:#cba6f7; --primary-fg:#1e1e2e; --link:#89b4fa; --danger:#f38ba8;
      --success-text:#a6e3a1; --success:#a6e3a1; --warn:#f9e2af; --warn-text:#f9e2af;
      --av-a:#45384a; --av-b:#2f3a55; --av-c:#2c4446; --av-d:#4a3a33; --av-e:#3d3355; --av-f:#2e4232;
      --shadow-card:0 1px 2px rgb(0 0 0 / .35), 0 8px 24px -10px rgb(0 0 0 / .65);
      --focus-ring:#b4befe;
    }
  }
  :root[data-theme="dark"] {
    color-scheme:dark;
    --page:#11111b; --bg:#181825; --bg-sunken:#11111b; --card:#232334; --card-hover:#2a2a3d;
    --border:#313244; --border-subtle:#292939; --border-input:#7f849c;
    --fg:#cdd6f4; --fg-muted:#bac2de; --fg-subtle:#a6adc8;
    --primary:#cba6f7; --primary-fg:#1e1e2e; --link:#89b4fa; --danger:#f38ba8;
    --success-text:#a6e3a1; --success:#a6e3a1; --warn:#f9e2af; --warn-text:#f9e2af;
    --av-a:#45384a; --av-b:#2f3a55; --av-c:#2c4446; --av-d:#4a3a33; --av-e:#3d3355; --av-f:#2e4232;
    --shadow-card:0 1px 2px rgb(0 0 0 / .35), 0 8px 24px -10px rgb(0 0 0 / .65);
    --focus-ring:#b4befe;
  }
  :root { --primary-soft:color-mix(in srgb, var(--primary) 14%, transparent);
          --warn-soft:color-mix(in srgb, var(--warn) 16%, transparent);
          --success-soft:color-mix(in srgb, var(--success) 14%, transparent); }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--fg); font-family:var(--sans); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--focus-ring); outline-offset:2px; border-radius:8px; }
  svg.i { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

  /* ── The document around the frame ───────────────────────── */
  .wrap { max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:24px 64px; }
  .kicker { font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--primary); }
  h1 { font-size:24px; font-weight:650; margin:4px 0 6px; letter-spacing:-.01em; text-wrap:balance; }
  .lede { color:var(--fg-muted); margin:0 0 16px; max-width:70ch; }
  .controls { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; margin-bottom:20px; }
  .ctl { display:flex; align-items:center; gap:8px; }
  .seg-label { font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-subtle); }
  .seg { display:flex; gap:3px; background:var(--bg); border-radius:999px; padding:3px; }
  .seg button { border:0; background:transparent; padding:5px 12px; border-radius:999px; font-size:13px; color:var(--fg-muted); cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--card); color:var(--fg); font-weight:600; box-shadow:var(--shadow-card); }
  .stage { display:flex; flex-wrap:wrap; gap:32px; align-items:flex-start; }
  .legend { flex:1 1 320px; max-width:62ch; }
  .legend h2 { font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-subtle); margin:18px 0 6px; }
  .legend h2:first-child { margin-top:0; }
  .legend p, .legend li { font-size:14px; color:var(--fg-muted); margin:0 0 6px; }
  .legend ul { padding-left:18px; margin:0; }
  .legend b { color:var(--fg); }

  /* ── Device: Pixel 9 Pro at 412 CSS px, or a desktop column ── */
  .device { flex:none; max-width:100%; padding:10px; background:#0b0b12; border-radius:46px; box-shadow:0 20px 60px rgb(0 0 0 / .25); }
  .screen { width:412px; max-width:100%; height:880px; border-radius:36px; overflow:hidden; background:var(--bg); display:flex; flex-direction:column; container-type:inline-size; }
  .device.desk { padding:0; border-radius:14px; background:var(--border); width:100%; flex-basis:100%; }
  .device.desk .screen { width:100%; height:820px; border-radius:13px; }
  .status { height:30px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:6px 26px 0; font-size:13px; font-weight:600; }
  .status i { width:12px; height:12px; border-radius:50%; background:#0b0b12; display:block; }
  .device.desk .status { display:none; }
  .top { display:flex; align-items:center; gap:6px; padding:8px 16px; font-size:14px; color:var(--fg-muted); flex:none; }
  .top .here { color:var(--fg); font-weight:600; }
  .scroll { flex:1; overflow-y:auto; scrollbar-width:thin; }
  .page { max-width:860px; margin:0 auto; padding:4px 12px 40px; display:flex; flex-direction:column; gap:12px; }

  /* Step strip, as the wizard has it */
  .steps { display:flex; gap:6px; list-style:none; padding:0; margin:0; flex-wrap:wrap; }
  .steps li { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--fg-subtle); padding:4px 10px 4px 4px; border-radius:999px; }
  .steps li b { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:12px; background:var(--bg-sunken); color:var(--fg-muted); font-variant-numeric:tabular-nums; }
  .steps li.done b { background:var(--success-soft); color:var(--success-text); }
  .steps li.on { background:var(--card); color:var(--fg); font-weight:600; box-shadow:var(--shadow-card); }
  .steps li.on b { background:var(--primary); color:var(--primary-fg); }

  .card { background:var(--card); border-radius:16px; box-shadow:var(--shadow-card); padding:16px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:10px; padding:7px 12px; font-size:14px; font-weight:500; border:1px solid var(--border); background:transparent; color:var(--fg-muted); cursor:pointer; white-space:nowrap; }
  .btn:hover { background:var(--card-hover); }
  .btn.primary { background:var(--primary); color:var(--primary-fg); border-color:transparent; }
  .btn.primary:hover { filter:brightness(1.06); }
  .btn[disabled] { opacity:.45; cursor:not-allowed; }
  .btn.ghost { border-color:transparent; }
  .muted { color:var(--fg-muted); }
  .subtle { color:var(--fg-subtle); font-size:13px; }

  /* Summary card */
  .summary h2 { margin:0 0 4px; font-size:18px; font-weight:650; }
  .counts { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 12px; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:13px; padding:3px 10px; border-radius:999px; background:var(--bg); color:var(--fg-muted); font-variant-numeric:tabular-nums; }
  .chip .dot { width:8px; height:8px; border-radius:50%; }
  .dot.strong { background:var(--success); } .dot.weak { background:var(--warn); } .dot.several { background:var(--primary); } .dot.none { background:var(--fg-subtle); }
  .bulk { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .quiet { font-size:13px; color:var(--fg-subtle); margin-top:10px; display:flex; flex-direction:column; gap:2px; }
  .quiet a { color:var(--link); text-decoration:underline; text-underline-offset:2px; cursor:pointer; }

  /* Review card */
  .rc { padding:0; overflow:hidden; transition:opacity .2s; }
  .rc.answered { opacity:.72; }
  .rc-head { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; padding:10px 16px; border-bottom:1px solid var(--border-subtle); font-size:13px; }
  .badge { white-space:nowrap; font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; display:inline-flex; align-items:center; gap:5px; }
  .badge.strong { background:var(--success-soft); color:var(--success-text); }
  .badge.weak { background:var(--warn-soft); color:var(--warn-text); }
  .badge.several { background:var(--primary-soft); color:var(--primary); }
  .badge.none { background:var(--bg); color:var(--fg-muted); }
  .rc-head .why { color:var(--fg-subtle); min-width:0; overflow-wrap:anywhere; flex:1 1 160px; }
  .rc-head .state { order:3; }
  .rc.closed .rc-head { border-bottom:0; }
  .closed-row { display:flex; align-items:center; gap:10px; padding:0 16px 12px; font-size:14px; flex-wrap:wrap; }
  .closed-row .arrow { color:var(--fg-subtle); }
  .closed-row .btn { margin-left:auto; padding:4px 10px; font-size:13px; }
  .rc-head .state { margin-left:auto; font-size:13px; font-weight:600; color:var(--success-text); white-space:nowrap; display:flex; align-items:center; gap:4px; }
  .sides { display:grid; grid-template-columns:1fr; }
  @container (min-width:640px) { .sides { grid-template-columns:1fr 1fr; } .side + .side { border-top:0; border-left:1px solid var(--border-subtle); } }
  .side { padding:12px 16px; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .side + .side { border-top:1px solid var(--border-subtle); }
  .side-label { font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-subtle); display:flex; align-items:center; gap:6px; }
  .who { display:flex; gap:10px; align-items:center; }
  .av { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-weight:600; font-size:14px; flex:none; color:var(--fg); }
  .av.photo { background:linear-gradient(135deg, var(--av-b), var(--av-e)); }
  .who .n { font-weight:600; overflow-wrap:anywhere; }
  .who .d { font-size:13px; color:var(--fg-subtle); }
  .facts { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3px; font-size:14px; }
  .facts li { display:flex; gap:8px; align-items:baseline; min-width:0; }
  .facts .k { font-size:12px; color:var(--fg-subtle); width:78px; flex:none; }
  .facts .v { min-width:0; overflow-wrap:anywhere; }
  .facts .lbl { color:var(--fg-subtle); font-size:12px; }
  .facts li.has .v { color:var(--fg-subtle); }
  .add { background:var(--success-soft); border-radius:10px; padding:8px 10px; }
  .add .side-label { color:var(--success-text); }
  .add .facts li::before { content:'+'; color:var(--success-text); font-weight:700; width:10px; flex:none; }
  .add .facts .k { width:68px; }
  .kept { font-size:13px; color:var(--fg-subtle); }
  .conflict { border:1px solid color-mix(in srgb, var(--warn) 55%, transparent); background:var(--warn-soft); border-radius:10px; padding:8px 10px; display:flex; flex-direction:column; gap:6px; }
  .conflict .side-label { color:var(--warn-text); }
  .conflict label { display:flex; align-items:center; gap:8px; font-size:14px; cursor:pointer; }
  .conflict input { accent-color:var(--primary); width:16px; height:16px; margin:0; }
  .nocand { font-size:14px; color:var(--fg-muted); }
  .picks { display:flex; flex-direction:column; gap:6px; }
  .pick { display:flex; gap:10px; align-items:center; padding:6px 8px; border:1px solid var(--border); border-radius:10px; background:transparent; cursor:pointer; text-align:left; }
  .pick[aria-pressed="true"] { border-color:var(--primary); background:var(--primary-soft); }
  .pick .av { width:32px; height:32px; font-size:12px; }
  .search { display:flex; align-items:center; gap:8px; border:1px solid var(--border-input); border-radius:10px; padding:6px 10px; background:var(--bg); }
  .search input { border:0; background:transparent; font:inherit; color:var(--fg); flex:1; min-width:0; outline:none; }
  .answers { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:10px 16px 14px; border-top:1px solid var(--border-subtle); }
  @container (min-width:640px) { .answers { grid-template-columns:repeat(4, auto); justify-content:start; } }
  .answers .btn[aria-pressed="true"] { background:var(--primary); color:var(--primary-fg); border-color:transparent; }
  .answers .btn.skip[aria-pressed="true"] { background:var(--fg-subtle); color:var(--card); }

  /* Sticky footer with the import button */
  .foot { flex:none; border-top:1px solid var(--border-subtle); background:var(--card); padding:10px 16px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .foot .left { font-size:13px; color:var(--fg-muted); font-variant-numeric:tabular-nums; flex:1; min-width:140px; }
  .done { text-align:center; padding:28px 16px; }
  .done h2 { margin:6px 0; font-size:18px; }
  .ok { width:44px; height:44px; border-radius:50%; background:var(--success-soft); color:var(--success-text); display:grid; place-items:center; margin:0 auto; }
</style>
</head>
<body>

<div class="wrap">
  <div class="kicker">Stella · concept mockup</div>
  <h1 id="doc-title"></h1>
  <p class="lede" id="doc-lede"></p>

  <div class="controls">
    <div class="ctl"><span class="seg-label" id="l-lang">Language</span>
      <div class="seg" id="seg-lang"><button data-v="en" aria-pressed="true">English</button><button data-v="de" aria-pressed="false">Deutsch</button></div></div>
    <div class="ctl"><span class="seg-label" id="l-theme">Theme</span>
      <div class="seg" id="seg-theme"><button data-v="system" aria-pressed="true">System</button><button data-v="light" aria-pressed="false">Latte</button><button data-v="dark" aria-pressed="false">Mocha</button></div></div>
    <div class="ctl"><span class="seg-label" id="l-dev">Device</span>
      <div class="seg" id="seg-dev"><button data-v="phone" aria-pressed="true">Phone</button><button data-v="desk" aria-pressed="false">Desktop</button></div></div>
    <button class="btn" id="reset" type="button"></button>
  </div>

  <div class="stage">
    <div class="device" id="device">
      <div class="screen">
        <div class="status"><span>9:41</span><i></i><span>5G</span></div>
        <div class="top"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span id="t-crumb"></span><span>›</span><span class="here" id="t-here"></span></div>
        <div class="scroll"><div class="page" id="page"></div></div>
        <div class="foot" id="foot"></div>
      </div>
    </div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<script>
const I = {
  check:'<path d="M5 12l5 5 9-10"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  skip:'<path d="M6 6l12 12M18 6L6 18"/>',
  file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  person:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  alert:'<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/>'
};
const ico = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

const S = {
  en: {
    docTitle:'Import people: matching review',
    docLede:'A Google export is in the wizard. Before anything is written, each contact Stella has not met before gets a card with the person it may be. Every button works. Synthetic data.',
    lang:'Language', theme:'Theme', dev:'Device', reset:'Start over', system:'System', phone:'Phone', desk:'Desktop',
    crumb:'Settings', here:'Import people',
    steps:['Preview','Review','Import','Photos'],
    sumTitle:'Who is who?',
    sumBody:'contacts.vcf from Google: 47 contacts. 41 are linked to their people already and unchanged since, so they are not shown.',

    legend:`<h2>What this shows</h2>

    incoming:'Von Google', suggested:'In Stella', pickOne:'Wer ist es?',
    wouldAdd:'Käme dazu', nothing:'Nichts Neues hinzuzufügen.', kept:(s)=>`Nicht übernommen: ${s}`,
    conflict:{ birthday:'Geburtstag weicht ab', name:'Name weicht ab' }, keep:'Stellas behalten', take:'Den der Karte nehmen',
    ans:{ same:'Dieselbe Person', other:'Jemand anderen wählen', new:'Neue Person', skip:'Überspringen' },
    state:{ same:'Dieselbe Person', other:'Gewählt', new:'Neue Person', skip:'Übersprungen' }, change:'Ändern',
    searchPh:'Person suchen', nobody:'Niemand in Stella hat diesen Namen, diese E-Mail oder Nummer.',
    newWill:'Kommt als neue Person mit allem von der Karte.',
    born:'geboren', noYear:'ohne Jahr',
    k:{ email:'E-Mail', phone:'Telefon', address:'Adresse', birthday:'Geburtstag', org:'Arbeitet bei', nick:'Spitzname', tags:'Tags', photo:'Foto' },
    lbl:{ Home:'Privat', Work:'Arbeit', Mobile:'Mobil', 'Old school':'Old school' },
    photoInline:'Bild auf der Karte', photoLink:'nur ein Link, wird nicht importiert',
    left:(n) => n === 0 ? 'Jeder Kontakt hat eine Antwort.' : `${n} ohne Antwort`,
    importBtn:(n) => `${n} Antworten importieren`,
    doneTitle:'Importiert', doneBody:(a,b,c) => `${a} Personen ergänzt, ${b} neu, ${c} übersprungen. Ein zweiter Import dieser Datei fragt nichts mehr.`,
    months:['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'],
    legend:`<h2>Was das zeigt</h2>
      <p>Der Schritt <b>Abgleich</b> liegt zwischen Vorschau und Import, nur für eine vCard. Eine Karte erscheint für jeden Kontakt, der eine Antwort braucht. Reihenfolge: sicher, dann nur Name, dann mehrere, dann neu.</p>
      <h2>Ausprobieren</h2>
      <ul><li>Die drei sicheren Treffer stehen schon auf <i>Dieselbe Person</i>, jeder zeigt, was dazukommt und wo etwas abweicht. <b>Alle 3 sicheren Treffer bestätigen</b> schließt sie, die Liste ist dann beim Rest. Jede Antwort schließt ihre Karte; <i>Ändern</i> öffnet sie wieder.</li>
      <li>Annas Geburtstag und Carlas Nachname sind <b>Abweichungen</b>. Stellas Wert bleibt, außer du wählst den der Karte.</li>
      <li>Eva Brunner hat <b>zwei Kandidatinnen</b>. Wähle eine, oder suche mit <i>Jemand anderen wählen</i>.</li>
      <li><b>Import</b> bleibt aus, bis jede Karte eine Antwort hat. <i>Restliche überspringen</i> beantwortet die offenen.</li></ul>
      <h2>Regeln (Konzept §1)</h2>
      <ul><li>Kandidaten sind Personen, die du sehen darfst und die nicht archiviert sind. Eine private Person von jemand anderem erscheint nie.</li>
      <li><i>Dieselbe Person</i> ergänzt nur, was fehlt. Beschriftungen werden zu Privat, Arbeit und Mobil. Googles <i>myContacts</i> und <i>starred</i> fallen weg.</li>
      <li>Antworten werden pro Quelle und Karte gemerkt. <i>Überspringen</i> gilt für immer, mit <i>Erneut fragen</i> unter Übersprungene Kontakte.</li></ul>`
  }
};

/* Synthetic cards. `day` is [year|null, month, day]. */
const CARDS = [
  { id:'anna', strength:'strong', why:['email','anna.example@example.org'],
    card:{ name:'Anna Example', av:'a', facts:[['email','anna.example@example.org','Home'],['email','anna.example@work.example.com','Work'],['email','anni@example.net','Old school'],['phone','+41 79 000 00 01','Mobile'],['birthday',[null,4,7]],['org','Example AG · Engineer'],['nick','Anni'],['tags','Family, Kindergarten 2023'],['photo','link']] },
    person:{ name:'Anna Example', av:'a', desc:[1986,4,17], has:[['email','anna.example@example.org','Home'],['address','Examplestrasse 1, 3007 Bern','Home']] },
    add:[['email','anna.example@work.example.com','Work'],['email','anni@example.net','Old school'],['phone','+41 79 000 00 01','Mobile'],['org','Example AG · Engineer'],['nick','Anni'],['tags','Family, Kindergarten 2023']],
    conflicts:[{ kind:'birthday', stella:[1986,4,17], card:[null,4,7] }] },
  { id:'bruno', strength:'strong', why:['phone','+41 79 000 00 04'],
    card:{ name:'Bruno Beispiel', av:'b', facts:[['phone','+41 79 000 00 04','Mobile'],['birthday',[1980,2,29]]] },
    person:{ name:'Bruno Beispiel', av:'b', desc:null, has:[['phone','079 000 00 04','Mobile']] },
    add:[['birthday',[1980,2,29]]], conflicts:[] },
  { id:'carla', strength:'strong', why:['phone','+41 79 000 00 05'],
    card:{ name:'Carla Muster', av:'c', facts:[['phone','0041 79 000 00 05','Mobile'],['birthday',[1990,5,1]],['photo','inline']] },
    person:{ name:'Carla Muster-Keller', av:'c', desc:[1990,5,1], has:[['phone','+41 79 000 00 05','Mobile']] },
    add:[['photo','inline']], conflicts:[{ kind:'name', stella:'Carla Muster-Keller', card:'Carla Muster' }] },
  { id:'david', strength:'weak', why:['name'],
    card:{ name:'David Probst', av:'d', facts:[['email','d.probst@example.com',null],['address','Musterweg 9, 3600 Thun',null]] },
    person:{ name:'David Probst', av:'d', desc:[1952,11,3], has:[] },
    add:[['email','d.probst@example.com',null],['address','Musterweg 9, 3600 Thun',null]], conflicts:[] },
  { id:'eva', strength:'several', why:['several',2],
    card:{ name:'Eva Brunner', av:'e', facts:[['email','eva.brunner@example.ch','Home'],['birthday',[2015,6,12]]] },
    candidates:[
      { name:'Eva Brunner', av:'e', desc:[1948,3,2], add:[['email','eva.brunner@example.ch','Home']], conflicts:[{ kind:'birthday', stella:[1948,3,2], card:[2015,6,12] }] },
      { name:'Eva Brunner', av:'f', desc:[2015,6,12], add:[['email','eva.brunner@example.ch','Home']], conflicts:[] }
    ] },
  { id:'felix', strength:'none', why:['none'],
    card:{ name:'Felix Neu', av:'f', facts:[['phone','+41 76 000 00 09','Mobile'],['org','Neu & Co']] } }
];

/* A strong match starts preselected Same person, open until confirmed; an answered card closes. */
const preselected = () => Object.fromEntries(CARDS.filter((c) => c.strength === 'strong').map((c) => [c.id, 'same']));
const state = { lang:'en', theme:'system', dev:'phone', answers:preselected(), closed:{}, conflicts:{}, pick:{}, searching:{}, imported:false };
const t = () => S[state.lang];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const initials = (n) => n.split(/[\s-]+/).filter(Boolean).slice(0,2).map((w) => w[0]).join('');
const fmtDay = ([y,m,d]) => state.lang === 'de'
  ? `${d}. ${t().months[m-1]}${y ? ' ' + y : ' (' + t().noYear + ')'}`
  : `${t().months[m-1]} ${d}${y ? ', ' + y : ' (' + t().noYear + ')'}`;
const avatar = (name, tone, photo) => `<span class="av ${photo ? 'photo' : ''}" style="${photo ? '' : `background:var(--av-${tone})`}" aria-hidden="true">${esc(initials(name))}</span>`;

function factValue([k, v, label]) {
  if (k === 'birthday') return esc(fmtDay(v));
  if (k === 'photo') return esc(v === 'inline' ? t().photoInline : t().photoLink);
  return esc(v) + (label ? ` <span class="lbl">${esc(t().lbl[label] ?? label)}</span>` : '');
}
const factList = (facts, cls = '') => `<ul class="facts">${facts.map((f) => `<li class="${cls}"><span class="k">${esc(t().k[f[0]])}</span><span class="v">${factValue(f)}</span></li>`).join('')}</ul>`;

function whyText(c) {
  const w = t().why, [kind, v] = c.why;
  return kind === 'email' ? w.email(v) : kind === 'phone' ? w.phone(v) : kind === 'several' ? w.several(v) : w[kind];
}

function conflictBlock(c, conf, i) {
  const key = `${c.id}-${i}`, chosen = state.conflicts[key] ?? 'keep';
  const show = (v) => conf.kind === 'birthday' ? fmtDay(v) : v;
  return `<div class="conflict"><div class="side-label">${ico('alert')}${esc(t().conflict[conf.kind])}</div>
    <label><input type="radio" name="cf-${key}" data-cf="${key}" value="keep" ${chosen === 'keep' ? 'checked' : ''}> ${esc(t().keep)}: <b>${esc(show(conf.stella))}</b></label>
    <label><input type="radio" name="cf-${key}" data-cf="${key}" value="take" ${chosen === 'take' ? 'checked' : ''}> ${esc(t().take)}: <b>${esc(show(conf.card))}</b></label></div>`;
}

function personSide(c, p) {
  const add = p.add ?? c.add, conflicts = p.conflicts ?? c.conflicts ?? [];
  const has = p.has ?? [];
  return `<div class="who">${avatar(p.name, p.av)}<div><div class="n">${esc(p.name)}</div>${p.desc ? `<div class="d">${esc(t().born)} ${esc(fmtDay(p.desc))}</div>` : ''}</div></div>
    ${has.length ? factList(has, 'has') : ''}
    ${add.length ? `<div class="add"><div class="side-label">${ico('plus')}${esc(t().wouldAdd)}</div>${factList(add)}</div>` : `<div class="kept">${esc(t().nothing)}</div>`}
    ${conflicts.map((conf, i) => conflictBlock(c, conf, i)).join('')}`;
}

function suggestedSide(c) {
  const ans = state.answers[c.id];
  if (c.strength === 'none' && ans !== 'other') {
    return `<div class="side-label">${ico('person')}${esc(t().suggested)}</div><div class="nocand">${esc(ans === 'new' ? t().newWill : t().nobody)}</div>`;
  }
  if (state.searching[c.id]) {
    return `<div class="side-label">${ico('search')}${esc(t().suggested)}</div>
      <label class="search">${ico('search')}<input id="s-${c.id}" placeholder="${esc(t().searchPh)}" value="Probst"></label>
      <div class="picks"><button class="pick" type="button" aria-pressed="${state.pick[c.id] === 'x' ? 'true' : 'false'}" data-pick="${c.id}" data-v="x">${avatar('Daniela Probst','c')}<span><div class="n">Daniela Probst</div><div class="subtle">${esc(t().born)} ${esc(fmtDay([1979,8,21]))}</div></span></button></div>
      ${state.pick[c.id] === 'x' ? personSide(c, { name:'Daniela Probst', av:'c', desc:[1979,8,21], add:c.add ?? c.card.facts.filter((f) => f[0] !== 'photo'), conflicts:[] }) : ''}`;
  }
  if (c.candidates) {
    const sel = state.pick[c.id];
    return `<div class="side-label">${ico('person')}${esc(t().pickOne)}</div>
      <div class="picks">${c.candidates.map((p, i) => `<button class="pick" type="button" aria-pressed="${sel === i ? 'true' : 'false'}" data-pick="${c.id}" data-v="${i}">${avatar(p.name, p.av)}<span><div class="n">${esc(p.name)}</div><div class="subtle">${esc(t().born)} ${esc(fmtDay(p.desc))}</div></span></button>`).join('')}</div>
      ${sel !== undefined ? personSide(c, c.candidates[sel]) : ''}`;
  }
  return `<div class="side-label">${ico('person')}${esc(t().suggested)}</div>${personSide(c, c.person)}`;
}

function cardHtml(c) {
  const ans = state.answers[c.id];
  const btn = (k, icon, cls = '') => {
    const disabled = (k === 'same' && (c.strength === 'none' || (c.candidates && state.pick[c.id] === undefined)));
    return `<button class="btn ${cls}" type="button" data-ans="${c.id}" data-v="${k}" aria-pressed="${ans === k ? 'true' : 'false'}" ${disabled ? 'disabled' : ''}>${ico(icon)}${esc(t().ans[k])}</button>`;
  };
  const head = `<div class="rc-head"><span class="badge ${c.strength}"><span class="dot ${c.strength}"></span>${esc(t()[c.strength])}</span>${ans && state.closed[c.id] ? `<span class="state">${ico('check')}${esc(t().state[ans])}</span>` : ''}<span class="why">${esc(whyText(c))}</span></div>`;
  if (state.closed[c.id]) {
    const target = ans === 'same' ? (c.candidates ? c.candidates[state.pick[c.id]].name : c.person.name) : ans === 'other' ? 'Daniela Probst' : null;
    return `<article class="card rc closed" id="card-${c.id}">${head}
      <div class="closed-row">${avatar(c.card.name, c.card.av)}<span>${esc(c.card.name)}</span>${target ? `<span class="arrow">→</span><span>${esc(target)}</span>` : ''}<button class="btn" type="button" data-reopen="${c.id}">${esc(t().change)}</button></div></article>`;
  }
  return `<article class="card rc" id="card-${c.id}">${head}
    <div class="sides">
      <div class="side"><div class="side-label">${ico('file')}${esc(t().incoming)}</div>
        <div class="who">${avatar(c.card.name, c.card.av)}<div class="n">${esc(c.card.name)}</div></div>${factList(c.card.facts)}</div>
      <div class="side">${suggestedSide(c)}</div>
    </div>
    <div class="answers">${btn('same','link')}${btn('other','search')}${btn('new','plus')}${btn('skip','skip','skip')}</div>
  </article>`;
}

function render() {
  const s = t();
  document.documentElement.lang = state.lang;
  document.getElementById('doc-title').textContent = s.docTitle;
  document.getElementById('doc-lede').textContent = s.docLede;
  document.getElementById('l-lang').textContent = s.lang;
  document.getElementById('l-theme').textContent = s.theme;
  document.getElementById('l-dev').textContent = s.dev;
  document.getElementById('reset').textContent = s.reset;
  document.querySelector('#seg-theme [data-v=system]').textContent = s.system;
  document.querySelector('#seg-dev [data-v=phone]').textContent = s.phone;
  document.querySelector('#seg-dev [data-v=desk]').textContent = s.desk;
  document.getElementById('t-crumb').textContent = s.crumb;
  document.getElementById('t-here').textContent = s.here;
  document.getElementById('legend').innerHTML = s.legend;
  document.getElementById('device').classList.toggle('desk', state.dev === 'desk');
  for (const [seg, v] of [['seg-lang', state.lang], ['seg-theme', state.theme], ['seg-dev', state.dev]])
    for (const b of document.querySelectorAll(`#${seg} button`)) b.setAttribute('aria-pressed', String(b.dataset.v === v));

  const steps = `<ol class="steps">${s.steps.map((n, i) => `<li class="${i === 0 || (state.imported && i < 3) ? 'done' : ''} ${(!state.imported && i === 1) || (state.imported && i === 3) ? 'on' : ''}"><b>${i === 0 || (state.imported && i < 3) ? '✓' : i + 1}</b>${esc(n)}</li>`).join('')}</ol>`;
  const page = document.getElementById('page'), foot = document.getElementById('foot');

  if (state.imported) {
    const v = Object.values(state.answers);
    const same = v.filter((a) => a === 'same' || a === 'other').length, nw = v.filter((a) => a === 'new').length, sk = v.filter((a) => a === 'skip').length;
    page.innerHTML = steps + `<div class="card done"><div class="ok">${ico('check')}</div><h2>${esc(s.doneTitle)}</h2><p class="muted">${esc(s.doneBody(same, nw, sk))}</p></div>`;
    foot.innerHTML = `<span class="left">${esc(s.quiet2)}</span><button class="btn primary" type="button" disabled>${esc(s.steps[3])} →</button>`;
    return;
  }

  const strongOpen = CARDS.filter((c) => c.strength === 'strong' && state.answers[c.id] === 'same' && !state.closed[c.id]).length;
  const n = (k) => CARDS.filter((c) => c.strength === k).length;
  const open = CARDS.filter((c) => !state.answers[c.id]).length;
  page.innerHTML = steps + `<section class="card summary"><h2>${esc(s.sumTitle)}</h2><div class="muted">${esc(s.sumBody)}</div>
      <div class="counts"><span class="chip"><span class="dot strong"></span>${n('strong')} ${esc(s.cStrong)}</span><span class="chip"><span class="dot weak"></span>${n('weak')} ${esc(s.cWeak)}</span><span class="chip"><span class="dot several"></span>${n('several')} ${esc(s.cSeveral)}</span><span class="chip"><span class="dot none"></span>${n('none')} ${esc(s.cNone)}</span></div>
      <div class="bulk">${strongOpen ? `<button class="btn primary" type="button" id="bulk">${ico('check')}${esc(s.bulk(strongOpen))}</button>` : `<span class="badge strong">${ico('check')}${esc(s.bulkDone)}</span>`}
        ${open ? `<button class="btn ghost" type="button" id="skiprest">${esc(s.skipRest)}</button>` : ''}</div>
      <div class="quiet"><span>${esc(s.quiet1)} <a role="button" tabindex="0">${esc(s.quietLink)}</a></span><span>${esc(s.quiet2)}</span></div>
    </section>` + CARDS.filter((c) => !state.closed[c.id]).map(cardHtml).join('') + CARDS.filter((c) => state.closed[c.id]).map(cardHtml).join('');
  foot.innerHTML = `<span class="left">${esc(s.left(open))}</span><button class="btn primary" type="button" id="import" ${open ? 'disabled' : ''}>${esc(s.importBtn(CARDS.length))}</button>`;
}

function applyTheme() {
  if (state.theme === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', state.theme);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('button, a');
  if (!el) return;
  const seg = el.closest('.seg');
  if (seg) {
    const key = { 'seg-lang':'lang', 'seg-theme':'theme', 'seg-dev':'dev' }[seg.id];
    state[key] = el.dataset.v;
    if (key === 'theme') applyTheme();
    return render();
  }
  if (el.id === 'reset') { Object.assign(state, { answers:preselected(), closed:{}, conflicts:{}, pick:{}, searching:{}, imported:false }); return render(); }
  if (el.id === 'bulk') { for (const c of CARDS) if (c.strength === 'strong' && state.answers[c.id] === 'same') state.closed[c.id] = true; return render(); }
  if (el.id === 'skiprest') { for (const c of CARDS) if (!state.answers[c.id]) { state.answers[c.id] = 'skip'; state.closed[c.id] = true; } return render(); }
  if (el.dataset.reopen) { delete state.closed[el.dataset.reopen]; return render(); }
  if (el.id === 'import') { state.imported = true; return render(); }
  if (el.dataset.pick) {
    const id = el.dataset.pick, v = el.dataset.v === 'x' ? 'x' : Number(el.dataset.v);
    state.pick[id] = v;
    if (v === 'x') { state.answers[id] = 'other'; state.closed[id] = true; }
    return render();
  }
  if (el.dataset.ans) {
    const id = el.dataset.ans, v = el.dataset.v;
    if (v === 'other') { state.searching[id] = !state.searching[id] || state.answers[id] !== 'other'; if (state.pick[id] === 'x') state.answers[id] = 'other'; else delete state.answers[id]; }
    else { state.searching[id] = false; if (state.pick[id] === 'x') delete state.pick[id]; state.answers[id] = v; state.closed[id] = true; }
    return render();
  }
});
document.addEventListener('change', (e) => {
  if (e.target.dataset.cf) { state.conflicts[e.target.dataset.cf] = e.target.value; }
});
render();
</script>
</body>
</html>
