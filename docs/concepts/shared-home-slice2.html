<html lang="en">

  .who h2 { margin:0; font-size:22px; font-weight:650; line-height:1.15; }
  .muted { font-size:13px; color:var(--fg-muted); } .subtle { font-size:12px; color:var(--fg-subtle); }
  .sechead { font-size:15px; font-weight:600; margin:0 0 10px; display:flex; align-items:center; gap:6px; }
  .fact { display:flex; gap:8px; align-items:flex-start; font-size:14px; }

  .form { display:flex; flex-direction:column; gap:10px; border-top:1px solid var(--border-subtle); padding-top:12px; margin-top:8px; }
  .lab { display:flex; flex-direction:column; gap:4px; font-size:14px; }
  .lab > span { color:var(--fg-muted); }
  .inp { background:var(--input); border:1px solid var(--border); border-radius:8px; padding:6px 10px; width:100%; font-size:14px; }
  .pick { display:flex; flex-wrap:wrap; gap:6px; align-items:center; background:var(--input); border:1px solid var(--border); border-radius:8px; padding:4px 6px; min-height:36px; }
  .pick input { border:0; background:transparent; flex:1; min-width:80px; outline:none; font-size:14px; }
  .chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--card); border-radius:999px; padding:1px 4px 1px 2px; font-size:13px; }
  .chip .x { border:0; background:transparent; width:20px; height:20px; border-radius:50%; display:grid; place-items:center; color:var(--fg-muted); cursor:pointer; }
  .mini { width:22px; height:22px; border-radius:50%; background:var(--av1); display:grid; place-items:center; font-size:10px; font-weight:600; flex:none; }
  .mini.b { background:var(--av3); } .mini.c { background:var(--av4); } .mini.d { background:var(--av2); }
  .panel { border:1px solid var(--border); border-radius:12px; background:var(--card); box-shadow:0 8px 24px rgba(0,0,0,.12); padding:12px; display:flex; flex-direction:column; gap:10px; }

  .row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .end { justify-content:flex-end; }
  .btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--card); border-radius:8px; padding:5px 12px; font-size:14px; cursor:pointer; color:var(--fg); }
  .btn.ghost { border-color:transparent; background:transparent; }
  .btn.ghost:hover { background:var(--bg-sunken); }
  .btn.primary { background:var(--primary); border-color:var(--primary); color:var(--primary-fg); font-weight:600; }
  .btn.sm { padding:4px 10px; font-size:13px; }
  .btn.full { width:100%; justify-content:center; }

  /* The offer: a ticked box, like the second-parent offer's dashed frame. */
  .offer { display:flex; gap:10px; align-items:flex-start; border:1px dashed var(--primary); border-radius:8px; padding:8px 10px; font-size:14px; cursor:pointer; }
  .offer.inpanel { border-style:solid; border-color:var(--border-subtle); background:var(--bg-sunken); }
  .offer input { width:18px; height:18px; margin:2px 0 0; accent-color:var(--primary); flex:none; }

  .offer .who2 .mini { margin-left:-6px; border:2px solid var(--card); } .offer .who2 .mini:first-child { margin-left:0; }

  /* Data-quality page */
  .back { display:flex; align-items:center; gap:4px; font-size:13px; color:var(--link); text-decoration:none; }
  h1.p { font-size:22px; font-weight:650; margin:4px 0 4px; }
  .empty { display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:28px 16px; border:1px dashed var(--border); border-radius:16px; }
  .empty .ico { width:52px; height:52px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:grid; place-items:center; }
  .group { background:var(--card); border-radius:16px; box-shadow:var(--shadow-card); padding:12px 14px; margin-bottom:10px; display:flex; flex-direction:column; gap:8px; transition:opacity .2s; }
  .group .addr { display:flex; gap:8px; align-items:flex-start; font-weight:600; font-size:15px; }
  .group .addr .subtle { font-weight:400; }
  .people { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
  .people li { display:flex; align-items:center; gap:8px; font-size:14px; }
  .people li .line { margin-left:auto; font-size:12px; color:var(--fg-subtle); max-width:48%; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .homebadge { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; color:var(--primary); background:var(--primary-soft); border-radius:999px; padding:1px 8px; }
  .drawer { margin-top:14px; font-size:13px; color:var(--fg-muted); }
  .drawer summary { cursor:pointer; }
  .drawer li { display:flex; gap:8px; align-items:center; padding:4px 0; }
  .qcard { display:flex; align-items:center; gap:12px; background:var(--card); border-radius:14px; box-shadow:var(--shadow-card); padding:12px; margin-bottom:8px; cursor:pointer; }
  .qcard .ic { width:36px; height:36px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:grid; place-items:center; flex:none; }
  .count { border-radius:999px; background:var(--primary-soft); color:var(--primary); font-size:12px; font-weight:600; padding:1px 8px; }

  .toast { position:absolute; left:16px; right:16px; bottom:92px; background:var(--toast-bg); color:var(--toast-fg); border:1px solid var(--border); border-radius:12px; padding:10px 14px; box-shadow:0 8px 24px rgba(0,0,0,.15); font-size:14px; display:none; align-items:center; gap:10px; }
  .toast.on { display:flex; }
  .toast button { margin-left:auto; border:0; background:transparent; color:var(--link); font-weight:600; cursor:pointer; }
  .tabbar { position:absolute; inset:auto 0 0 0; display:flex; border-top:1px solid var(--border-subtle); background:var(--card); padding:10px 0 16px; justify-content:space-around; font-size:11px; color:var(--fg-subtle); }
  .tabbar .on { color:var(--primary); font-weight:600; }
</style>
</head>

        <ul><li><b>Ein Zuhause machen</b> — die gleichen Zeilen werden ein Zuhause; alle wohnen darin. Rückgängig im Toast.</li>
        <li><b>Einziehen</b> — wohnt jemand schon in einem Zuhause mit dieser Adresse, ziehen die anderen ein und ihre eigene Zeile verschwindet.</li>
        <li><b>Nicht dieselbe</b> — für diese Gruppe gemerkt; unten in der Schublade mit <i>Wieder fragen</i>.</li></ul>
        <p>Die Karte in den Einstellungen zeigt die offene Zahl, sobald einmal geprüft wurde.</p>`
    }
  }
};

const GROUPS = [
  { id: 'g1', kind: 'make', addr: 'Seestrasse 12, 8002 Zürich', people: [
      ['LW', 'Lea Widmer', 'Seestrasse 12, 8002 Zürich', ''], ['RW', 'Reto Widmer', 'seestrasse 12 · 8002 zürich', 'b']] },
  { id: 'g2', kind: 'join', addr: 'Lindenweg 4, 8800 Thalwil', holders: 'Anna, Peter', people: [
      ['JB', 'Jonas Brunner', 'Lindenweg 4, 8800 Thalwil', 'c']] },
  { id: 'g3', kind: 'make', addr: 'Dorfstrasse 3, 6300 Zug', people: [
      ['MS', 'Marco Steiner', 'Dorfstrasse 3, 6300 Zug', 'd'], ['CS', 'Clara Steiner', 'Dorfstrasse 3, 6300 Zug', ''], ['NS', 'Nina Steiner', 'Dorfstr. 3, 6300 Zug', 'b']] }
];

const state = { view: 'add', v: 'B', lang: 'en', theme: 'latte', step: 'form', ticked: true, checked: false, resolved: {}, declined: [] };
let toastTimer = null; let undoFn = null;
const L = () => T[state.lang];

function seg(id, items, key, values) {
  const el = document.getElementById(id);
  el.innerHTML = items.map((label, i) => `<button aria-pressed="${state[key] === values[i]}" data-v="${values[i]}">${label}</button>`).join('');
  el.querySelectorAll('button').forEach((b) => b.onclick = () => { state[key] = b.dataset.v; render(); });
}

function toast(text, undo) {
  const t = document.getElementById('toast');
  document.getElementById('toast-text').textContent = text;
  const u = document.getElementById('toast-undo'); u.textContent = L().undo; u.style.display = undo ? '' : 'none';
  undoFn = undo; t.classList.add('on'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 5000);
}
document.getElementById('toast-undo').onclick = () => { document.getElementById('toast').classList.remove('on'); if (undoFn) { undoFn(); render(); } };

function offer(inPanel) {
  const l = L();
  return `<label class="offer ${inPanel ? 'inpanel' : ''}" data-testid="lives-at-offer">
    <input type="checkbox" id="lives" ${state.ticked ? 'checked' : ''} />
    <span><span style="display:flex;gap:6px;align-items:center">${ic.home}<b style="font-weight:600">${l.livesAt}</b></span>
      <span class="who2"><span class="mini d">AB</span><span class="mini">PB</span><span class="mini b">TB</span><span class="subtle" style="margin-left:6px">${l.livesWith}</span></span></span>
  </label>`;
}

function addView() {
  const l = L();
  const created = state.step !== 'form' && state.step !== 'panel';
  let picker;
  if (state.step === 'panel') {
    picker = `<div class="pick"><input value="Mia" /></div>
      <div class="panel">
        <div style="font-weight:600;font-size:14px">${l.createTitle}</div>
        <div class="grid2"><label class="lab xs"><span>${l.first}</span><input class="inp" value="Mia" /></label>
          <label class="lab xs"><span>${l.last}</span><input class="inp" value="Brunner" /></label></div>
        <label class="lab xs"><span>${l.description}</span><input class="inp" placeholder="…" /></label>
        <div class="subtle">▸ ${l.more}</div>
        ${state.v === 'A' ? offer(true) : ''}
        <div class="vis"><button aria-pressed="true">${ic.shared} ${l.shared}</button><button aria-pressed="false">${ic.private} ${l.private}</button></div>
        <div class="row end"><button class="btn ghost sm" id="cancel">${l.cancel}</button><button class="btn primary sm" id="create">${l.create}</button></div>
      </div>`;
  } else if (created) {
    picker = `<div class="pick"><span class="chip"><span class="mini c">MB</span>${l.newChip}<button class="x" id="unpick">${ic.x}</button></span><input placeholder="" /></div>
      ${state.v === 'B' && state.step === 'chip' ? offer(false) : ''}`;
  } else {
    picker = `<div class="pick"><input id="search" placeholder="${l.search}" /></div>`;
  }
  const saved = state.step === 'saved';
  return `
    <div class="card"><div class="who"><div class="avatar">AB</div><div><h2>Anna Brunner</h2><div class="muted">${l.desc}</div></div></div></div>
    <div class="card"><div class="sechead">${ic.home} ${l.addressHead}</div>
      <div class="fact"><div><div>Lindenweg 4, 8800 Thalwil</div><div class="subtle">${saved && state.homeTaken ? l.homeWith.replace(/Tim/, 'Tim, Mia').replace(/ und Tim/, ', Tim und Mia').replace(/ and Tim/, ', Tim and Mia') : l.homeWith}</div></div></div></div>
    <div class="card"><div class="sechead">${ic.people} ${l.relHead}</div>
      <div class="muted">${l.parent} <b>Tim Brunner</b>${saved ? ', <b>Mia Brunner</b>' : ''} · ${l.partner} <b>Peter Brunner</b></div>
      ${saved ? '' : `<div class="form">
        <label class="lab"><span>${l.isOf}</span><select class="inp"><option>${l.parent}</option><option>${l.partner}</option></select></label>
        <div class="lab"><span>${l.person}</span>${picker}</div>
        ${state.step === 'panel' ? '' : `<label class="lab"><span>${l.howConnect}</span><input class="inp" /></label>
        <button class="btn primary full" id="add" ${created ? '' : 'disabled style="opacity:.45"'}>${l.add}</button>`}
      </div>`}
    </div>`;
}

function qualityView() {
  const l = L();
  const open = GROUPS.filter((g) => !state.resolved[g.id]);
  let body;
  if (!state.checked) {
    body = `<div class="empty"><div class="ico">${ic.home.replace('class="i"', 'class="i s28"')}</div>
      <div style="font-weight:600">${l.idle}</div><div class="muted">${l.idleHint}</div>
      <button class="btn primary" id="check">${ic.search} ${l.check}</button></div>`;
  } else if (open.length === 0) {
    body = `<div class="empty"><div class="ico">${ic.home.replace('class="i"', 'class="i s28"')}</div>
      <div style="font-weight:600">${l.done}</div><div class="muted">${l.doneHint}</div></div>`;
  } else {
    body = `<p class="muted" role="status" style="margin:0 0 8px">${l.open(open.length)}</p>` + open.map((g) => {
      const rows = g.people.map(([ini, name, line, c]) => `<li><span class="mini ${c}">${ini}</span>${name}<span class="line" title="${line}">${line}</span></li>`).join('');
      const join = g.kind === 'join';
      return `<section class="group" data-g="${g.id}">
        <div class="addr">${ic.home}<div>${g.addr}${join ? `<div><span class="homebadge">${ic.home.replace('class="i"', 'class="i s12"')} ${l.homeOf(g.holders)}</span></div>` : ''}</div></div>
        <ul class="people">${rows}</ul>
        ${join ? `<div class="subtle">${l.joinWhy(g.people[0][1])}</div>` : ''}
        <div class="row end"><button class="btn ghost sm" data-no="${g.id}">${l.notSame}</button>
          <button class="btn primary sm" data-yes="${g.id}">${join ? l.joinHome : l.makeHome}</button></div>
      </section>`;
    }).join('');
  }
  const drawer = state.declined.length ? `<details class="drawer"><summary>${l.declined(state.declined.length)}</summary><ul style="list-style:none;padding:0;margin:6px 0 0">${
    state.declined.map((id) => { const g = GROUPS.find((x) => x.id === id); return `<li>${ic.home}<span>${g.addr}</span><button class="btn ghost sm" style="margin-left:auto" data-again="${id}">${l.askAgain}</button></li>`; }).join('')}</ul></details>` : '';
  return `<a class="back" href="#" id="toSettings">${ic.back}${l.settings}</a>
    <h1 class="p">${l.qSame}</h1><p class="muted" style="margin:0 0 14px">${l.intro}</p>${body}${drawer}`;
}

function settingsView() {
  const l = L();
  const open = GROUPS.filter((g) => !state.resolved[g.id]).length;
  const card = (icon, title, blurb, extra = '', id = '') => `<div class="qcard" ${id ? `id="${id}"` : ''}><span class="ic">${icon}</span><span style="flex:1;min-width:0"><b style="font-weight:600;display:block">${title}</b><span class="muted">${blurb}</span></span>${extra}${ic.fwd}</div>`;
  return `<h1 class="p">${l.settings}</h1><div class="muted" style="font-weight:500;margin:12px 0 8px">${l.qHeading}</div>
    ${card(ic.search.replace('class="i"', 'class="i s18"'), l.qRel, l.qRelBlurb)}
    ${card(ic.home.replace('class="i"', 'class="i s18"'), l.qSame, l.qSameBlurb, state.checked && open ? `<span class="count">${open}</span>` : '', 'toQuality')}
    ${card(ic.rename, l.qLast, l.qLastBlurb)}
    ${card(ic.tidy, l.qFirst, l.qFirstBlurb)}`;
}

function wire() {
  const $ = (id) => document.getElementById(id);
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = (e) => { e.preventDefault(); fn(); render(); }; };
  if ($('search')) $('search').onfocus = () => { state.step = 'panel'; render(); };
  on('cancel', () => state.step = 'form');
  on('create', () => { state.homeTaken = state.v === 'A' ? state.ticked : undefined; state.step = 'chip'; });
  on('unpick', () => state.step = 'form');
  on('add', () => {
    if (state.v === 'B') state.homeTaken = state.ticked;
    state.step = 'saved';
    toast(state.homeTaken ? L().savedHome : L().savedNoHome, () => { state.step = 'chip'; });
  });
  if ($('lives')) $('lives').onchange = (e) => { state.ticked = e.target.checked; };
  on('check', () => state.checked = true);
  on('toSettings', () => state.view = 'settings');
  on('toQuality', () => state.view = 'quality');
  document.querySelectorAll('[data-yes]').forEach((b) => b.onclick = () => {
    const g = GROUPS.find((x) => x.id === b.dataset.yes); state.resolved[g.id] = 'yes';
    const names = g.people.map((p) => p[1].split(' ')[0]).join(', ');
    toast(g.kind === 'join' ? L().joined(g.people[0][1]) : L().madeHome(names), () => { delete state.resolved[g.id]; });
    render();
  });
  document.querySelectorAll('[data-no]').forEach((b) => b.onclick = () => {
    const id = b.dataset.no; state.resolved[id] = 'no'; state.declined.push(id);
    toast(L().kept, () => { delete state.resolved[id]; state.declined = state.declined.filter((x) => x !== id); });
    render();
  });
  document.querySelectorAll('[data-again]').forEach((b) => b.onclick = () => {
    const id = b.dataset.again; delete state.resolved[id]; state.declined = state.declined.filter((x) => x !== id); render();
  });
}

function render() {
  const l = L();
  document.documentElement.dataset.theme = state.theme;
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-t]').forEach((el) => el.textContent = l[el.dataset.t]);
  seg('seg-view', l.views, 'view', ['add', 'quality', 'settings']);
  seg('seg-v', l.variants, 'v', ['A', 'B']);
  document.getElementById('seg-v').hidden = state.view !== 'add';
  seg('seg-lang', ['English', 'Deutsch'], 'lang', ['en', 'de']);
  seg('seg-theme', ['Latte', 'Mocha'], 'theme', ['latte', 'mocha']);
  document.getElementById('reset').textContent = l.reset;
  const screen = document.getElementById('screen');
  screen.innerHTML = state.view === 'add' ? addView() : state.view === 'quality' ? qualityView() : settingsView();
  const tab = state.view === 'add' ? 1 : -1;
  document.getElementById('tabbar').innerHTML = l.tabs.map((x, i) => `<span class="${i === tab ? 'on' : ''}">${x}</span>`).join('');
  document.getElementById('legend').innerHTML = state.view === 'add' ? l.legend.add + l.legend[state.v] : l.legend.quality;
  wire();
}
document.getElementById('reset').onclick = () => {
  Object.assign(state, { step: 'form', ticked: true, checked: false, resolved: {}, declined: [], homeTaken: undefined });
  render();
};

// ?view=add&v=A&step=panel&lang=de&theme=mocha — for the screenshots.
const q = new URLSearchParams(location.search);
for (const k of ['view', 'v', 'lang', 'theme', 'step']) if (q.get(k)) state[k] = q.get(k);
if (q.get('checked')) state.checked = true;
render();
</script>
</body>
</html>
